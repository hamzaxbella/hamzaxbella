name: README Connect Four
on:
  issues:
    types: [opened]
  workflow_dispatch:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/game.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: readme-game
  cancel-in-progress: false
jobs:
  play:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'play|')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      - name: Test game rules
        run: python3 -m unittest discover -s game -p 'test_*.py'
      - name: Process pending moves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 game/play.py
